name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Create a clean Android project
        run: |
          rm -rf android
          flutter create --platforms=android --org com.homefinance --project-name family_finance .

      - name: Configure app name, permissions, Wi-Fi Sync
        run: dart run tool/prepare_android.dart

      - name: Check the app name was applied
        run: |
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml
          grep -q 'android:label="Home Finance"' android/app/src/main/AndroidManifest.xml

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release --build-name=1.0.5 --build-number=15

      - name: Show APK details
        continue-on-error: true
        run: |
          ls -la build/app/outputs/flutter-apk/
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | tail -1)
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk | grep -E "^package:|application-label:" || true

      - uses: actions/upload-artifact@v4
        with:
          name: HomeFinance_apk
          path: build/app/outputs/flutter-apk/app-release.apk
