name: family_finance
version: 1.0.5+15
publish_to: 'none'
description: Home Finance - local-first multi-user household income and expenditure app.
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  intl: ^0.20.2
  uuid: ^4.5.1
  pdf: ^3.11.3
  excel: ^4.0.6
  path_provider: ^2.1.5
  share_plus: ^11.1.0
  file_picker: ^10.3.10
  google_sign_in: ^6.2.2
  http: ^1.3.0
  crypto: ^3.0.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  adaptive_icon_background: '#11244C'
  adaptive_icon_foreground: assets/app_icon_foreground.png
  adaptive_icon_monochrome: assets/app_icon_monochrome.png
  remove_alpha_ios: true
